name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release manually (e.g. v0.3.0)'
        required: true
        type: string

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - uses: Litote/ci/.github/actions/release-please@c111317515db0963d8dfebb7821cefbc92d34897 # v0.9.0
        id: release-please
        if: github.event_name == 'push'
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

  publish:
    name: Publish ${{ needs.release-please.outputs.tag_name || inputs.tag }} (JVM / JS / Linux)
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      # no release asset upload: read access is enough
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.release-please.outputs.tag_name || inputs.tag }}
          fetch-depth: 0

      - uses: Litote/ci/.github/actions/setup-gradle@c111317515db0963d8dfebb7821cefbc92d34897 # v0.9.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - uses: Litote/ci/.github/actions/set-release-version@c111317515db0963d8dfebb7821cefbc92d34897 # v0.9.0
        with:
          tag: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          jvm-args: -Xmx6g -Dfile.encoding=UTF-8

      - name: Build & test
        run: ./gradlew check

      - name: Jacoco aggregated report
        run: ./gradlew jacocoAggregatedReport --no-configuration-cache

      # Fails if the quality gate is not OK, so nothing is published
      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --no-configuration-cache

      # Publishes JVM, JS, WASM, Linux and KotlinMultiplatform metadata.
      # Apple targets are excluded here and handled by the publish-macos job.
      - uses: Litote/ci/.github/actions/maven-central-publish@510461dc1f569a7c12735a6cad12e88a6cb533ad # v0.10.0
        with:
          gradle-args: >
            publishAndReleaseToMavenCentral
            --max-workers=8
            -x publishMacosArm64PublicationToMavenCentralRepository
            -x publishIosArm64PublicationToMavenCentralRepository
            -x publishIosSimulatorArm64PublicationToMavenCentralRepository
          maven-central-username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          maven-central-password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          signing-key: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          signing-key-id: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          signing-key-password: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

  publish-macos:
    name: Publish ${{ needs.release-please.outputs.tag_name || inputs.tag }} (Apple)
    runs-on: macos-latest
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      # no release asset upload: read access is enough
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.release-please.outputs.tag_name || inputs.tag }}
          fetch-depth: 0

      - uses: Litote/ci/.github/actions/setup-gradle@c111317515db0963d8dfebb7821cefbc92d34897 # v0.9.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - uses: Litote/ci/.github/actions/set-release-version@c111317515db0963d8dfebb7821cefbc92d34897 # v0.9.0
        with:
          tag: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          jvm-args: -Xmx6g -Dfile.encoding=UTF-8

      # Publishes only Apple targets (macOS, iOS).
      # JVM / JS / WASM / Linux / KotlinMultiplatform metadata are handled by the publish job.
      - uses: Litote/ci/.github/actions/maven-central-publish@510461dc1f569a7c12735a6cad12e88a6cb533ad # v0.10.0
        with:
          gradle-args: >
            publishAndReleaseToMavenCentral
            --no-configuration-cache
            --max-workers=4
            -x publishJvmPublicationToMavenCentralRepository
            -x publishJsPublicationToMavenCentralRepository
            -x publishWasmJsPublicationToMavenCentralRepository
            -x publishLinuxX64PublicationToMavenCentralRepository
            -x publishKotlinMultiplatformPublicationToMavenCentralRepository
          maven-central-username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          maven-central-password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          signing-key: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          signing-key-id: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          signing-key-password: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

  finalize-release:
    name: Publish GitHub Release ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    runs-on: ubuntu-latest
    # Releases are created as drafts (see release-please-config.json) because the repository
    # enforces immutable releases: assets can only be uploaded before the release is published.
    needs: [release-please, publish, publish-macos]
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - uses: Litote/ci/.github/actions/publish-draft-release@c111317515db0963d8dfebb7821cefbc92d34897 # v0.9.0
        with:
          tag: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: Publish KDoc to GitHub Pages
    runs-on: ubuntu-latest
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.release-please.outputs.tag_name || inputs.tag }}
          fetch-depth: 0

      - uses: Litote/ci/.github/actions/setup-gradle@c111317515db0963d8dfebb7821cefbc92d34897 # v0.9.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - uses: Litote/ci/.github/actions/set-release-version@c111317515db0963d8dfebb7821cefbc92d34897 # v0.9.0
        with:
          tag: ${{ needs.release-please.outputs.tag_name || inputs.tag }}

      - name: Generate KDoc
        run: ./gradlew dokkaGeneratePublicationHtml --no-configuration-cache

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/dokka/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
