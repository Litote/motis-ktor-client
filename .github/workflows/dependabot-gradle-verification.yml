name: Update Gradle verification metadata

on:
  pull_request_target:
    branches: [ main ]
    paths:
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'

jobs:
  update-verification-metadata:
    name: Regenerate verification metadata
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # Checkout the base branch (trusted code, the pull_request_target default) to avoid executing
      # untrusted build scripts. Only the version files (libs.versions.toml, gradle-wrapper.properties)
      # are then fetched from the PR branch — these have safe, predictable content from dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Apply dependabot version changes
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          # generated/ comes from the PR branch too, so that only a real regeneration change is committed
          git checkout FETCH_HEAD -- gradle/libs.versions.toml gradle/wrapper/gradle-wrapper.properties gradle/verification-metadata.xml generated

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Regenerate verification metadata
        run: ./gradlew --write-verification-metadata sha256 --no-configuration-cache dependencies check jacocoAggregatedReport compileIntegrationTestKotlinJvm dokkaGeneratePublicationHtml publishToMavenLocal

      # a generator version change also changes the generated client, committed with the metadata
      - name: Commit updated verification metadata and generated client
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          BRANCH: ${{ github.head_ref }}
        run: |
          CHANGED=$(git status --porcelain --untracked-files=all -- gradle/verification-metadata.xml generated)
          if [[ -z "$CHANGED" ]]; then
            echo "No changes to commit."
            exit 0
          fi
          echo "$CHANGED"
          # Use the API to get the PR branch HEAD — git rev-parse HEAD would return
          # the base branch SHA since we checked out github.base_ref, not the PR branch.
          PARENT_SHA=$(gh api "repos/$OWNER/$REPO/git/refs/heads/$BRANCH" --jq '.object.sha')

          CURRENT_TREE=$(gh api "repos/$OWNER/$REPO/git/commits/$PARENT_SHA" --jq '.tree.sha')

          # One blob per changed file (payloads in temp files to avoid "Argument list too long"
          # for verification-metadata.xml); a deleted file gets an empty sha.
          ENTRIES="$RUNNER_TEMP/tree-entries.tsv"
          : > "$ENTRIES"
          git status --porcelain -z --untracked-files=all -- gradle/verification-metadata.xml generated |
            while IFS= read -r -d '' ENTRY; do
              FILE="${ENTRY:3}"
              SHA=""
              if [[ -e "$FILE" ]]; then
                python3 -c "import base64, json, sys; print(json.dumps({'content': base64.b64encode(open(sys.argv[1], 'rb').read()).decode(), 'encoding': 'base64'}))" "$FILE" > "$RUNNER_TEMP/blob-payload.json"
                SHA=$(gh api "repos/$OWNER/$REPO/git/blobs" --input "$RUNNER_TEMP/blob-payload.json" --jq '.sha')
              fi
              printf '%s\t%s\n' "$FILE" "$SHA" >> "$ENTRIES"
            done

          python3 - "$CURRENT_TREE" "$ENTRIES" > "$RUNNER_TEMP/tree-payload.json" <<'EOF'
          import json, sys
          tree = []
          for line in open(sys.argv[2]):
              path, sha = line.rstrip("\n").split("\t")
              tree.append({"path": path, "mode": "100644", "type": "blob", "sha": sha or None})
          print(json.dumps({"base_tree": sys.argv[1], "tree": tree}))
          EOF

          TREE_SHA=$(gh api "repos/$OWNER/$REPO/git/trees" --input "$RUNNER_TEMP/tree-payload.json" --jq '.sha')

          COMMIT_SHA=$(gh api "repos/$OWNER/$REPO/git/commits" \
            --field message="chore: update gradle verification metadata and generated client" \
            --field tree="$TREE_SHA" \
            --field "parents[]=$PARENT_SHA" \
            --jq '.sha')

          gh api "repos/$OWNER/$REPO/git/refs/heads/$BRANCH" \
            --method PATCH \
            --field sha="$COMMIT_SHA"
