kotlin.code.style=official
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# org.gradle.configureondemand=true is disabled because Kotlin/JS and Kotlin/Wasm targets
# do not support Configuration on Demand. See https://youtrack.jetbrains.com/issue/KT-52074
org.gradle.daemon.idletimeout=900000

GROUP=org.litote
VERSION_NAME=main-SNAPSHOT

# publication properties
mavenCentralPublishing=true
mavenCentralAutomaticPublishing=true
signAllPublications=true
com.vanniktech.maven.publish.nexus.timeout=600
# Maven Central counts every published file (checksums and signatures included) against monthly limits.
# These are the vanniktech defaults, made explicit: only md5/sha1 checksums, none for .asc signatures.
mavenCentralChecksums=md5,sha1
mavenCentralExcludeSignatureChecksums=true

POM_NAME=motis-ktor-client
POM_DESCRIPTION=Kotlin Multiplatform Ktor client for the MOTIS / Transitous routing API
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/Litote/motis-ktor-client

POM_LICENSE_NAME=Apache-2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/Litote/motis-ktor-client
POM_SCM_CONNECTION=scm:git:git://github.com/Litote/motis-ktor-client.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/Litote/motis-ktor-client.git

POM_DEVELOPER_ID=zigzago
POM_DEVELOPER_NAME=Julien Buret
POM_DEVELOPER_URL=https://github.com/zigzago
POM_DEVELOPER_EMAIL=zigzago@litote.org
